name: "lpg_sanity_dual_metric"
function_name: "fit_developmental_model"

# Fast sanity: confirm the 64GB pod can materialise the 297-agent
# compute_per_agent_weights step that OOM'd at 16GB, and measure peak RSS
# to size parallelism. skip_main_training -> straight to the sweep.
function_kwargs:
  model_type: "multi_kl"
  num_epochs: 3
  save_name: "RUN_NAME"
  offline: true
  skip_main_training: true
  no_goal_mode: "full_distribution"
  model_kwargs:
    value_function:
      structure: "upper_triangular"

  few_shot_sweep_kwargs:
    agent_counts: [1]
    n_trials_per_size: 1
    seed: 42

  get_runs_from_wandb_kwargs:
    name_regex_filter: "maze_eval_"
    wandb_filters:
      "displayName": {"$regex": "^maze_eval_"}
