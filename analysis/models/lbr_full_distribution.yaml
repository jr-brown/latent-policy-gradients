name: "fit_klr"
function_name: "fit_developmental_model"

function_kwargs:
  model_type: "multi_kl"
  num_epochs: 3
  no_goal_mode: "full_distribution"

  compute_baselines: True
  baselines_epoch_scaling: 3

  get_runs_from_wandb_kwargs:
    name_regex_filter: "maze_eval_"
    wandb_filters:
      "displayName": {"$regex": "^maze_eval_"}
