name: "few_shot_multi_kl_model"
function_name: "fit_developmental_model"

function_kwargs:
  model_type: "multi_kl"
  num_epochs: 3
  save_name: "RUN_NAME"
  model_kwargs:
    value_function:
      structure: "upper_triangular"

  # Enable few-shot validation
  few_shot_kwargs:
    n_train_agents: 30
    n_trials: 3
    seed: 42

  get_runs_from_wandb_kwargs:
    name_regex_filter: "maze_eval_"
    wandb_filters:
      "displayName": {"$regex": "^maze_eval_"}
