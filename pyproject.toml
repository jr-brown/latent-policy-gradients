[project]
name = "rl-generalisation"
version = "0.1.0"
description = "Reinforcement learning experiments on generalisation and shard theory: training, distilling, and analysing agents on configurable maze tasks, with computational models of agent preferences."
readme = "README.md"
requires-python = "==3.13.*"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Jason Brown", email = "jrb239@cam.ac.uk" },
]
keywords = ["reinforcement-learning", "generalisation", "shard-theory", "preference-modelling", "distillation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beartype>=0.22.5",
    "gymnasium>=1.2.2",
    "jaxtyping>=0.3.3",
    "numpy>=2.3.4",
    "pygame>=2.6.1",
    "research-scaffold",
    "stable-baselines3>=2.7.0",
    "tensorboard>=2.20.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "tqdm>=4.67.1",
    "wandb>=0.22.3",
    "skypilot",
    "jax",
    "optax",
    "rpod",
    "python-dotenv>=1.2.1",
]

[tool.uv.sources]
research-scaffold = { git = "https://github.com/jr-brown/research-scaffold.git" }
rpod = { git = "https://github.com/jr-brown/rpod" }
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "tools"]
